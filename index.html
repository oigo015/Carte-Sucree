<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Carte Sucrée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ECE0C3;
    --surface: #FFFFFF;
    --surface-alt: #E3D4AC;
    --ink: #332E26;
    --ink-soft: #8C8170;
    --line: #D2BE8E;
    --accent: #71835F;
    --accent-ink: #FFFFFF;
    --gold: #AD8A4C;
    --near: #5C8567;
    --danger: #B15D4C;
    --focus: #332E26;
    --shadow: 0 8px 20px rgba(60,46,20,0.16);
    --overlay: rgba(40,33,22,0.55);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #15120D;
      --surface: #2B251C;
      --surface-alt: #362E21;
      --ink: #EFE7D5;
      --ink-soft: #AA9E88;
      --line: #493F2C;
      --accent: #93AC83;
      --accent-ink: #1A1712;
      --gold: #D6B978;
      --near: #8FB08A;
      --danger: #D99A85;
      --focus: #EFE7D5;
      --shadow: 0 8px 24px rgba(0,0,0,0.5);
      --overlay: rgba(0,0,0,0.65);
    }
  }
  :root[data-theme="dark"]{
    --bg: #15120D;
    --surface: #2B251C;
    --surface-alt: #362E21;
    --ink: #EFE7D5;
    --ink-soft: #AA9E88;
    --line: #493F2C;
    --accent: #93AC83;
    --accent-ink: #1A1712;
    --gold: #D6B978;
    --near: #8FB08A;
    --danger: #D99A85;
    --focus: #EFE7D5;
    --shadow: 0 8px 24px rgba(0,0,0,0.5);
    --overlay: rgba(0,0,0,0.65);
  }

  body.all-view{
    --accent: #A65B3F;
  }
  @media (prefers-color-scheme: dark){
    body.all-view:not([data-theme="light"]){
      --accent: #D98F63;
    }
  }
  body.all-view[data-theme="dark"]{
    --accent: #D98F63;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 10% 0%, rgba(173,138,76,0.06), transparent 45%),
      radial-gradient(circle at 90% 12%, rgba(113,131,95,0.07), transparent 40%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding:0 0 48px;
  }
  body.all-view{
    background-image:
      radial-gradient(circle at 10% 0%, rgba(166,91,63,0.09), transparent 45%),
      radial-gradient(circle at 90% 12%, rgba(166,91,63,0.05), transparent 40%);
  }
  .wrap{
    max-width:520px;
    margin:0 auto;
    padding:32px 18px 0;
  }
  header{
    position:relative;
    text-align:center;
    margin-bottom:26px;
    padding-bottom:20px;
  }
  .kicker{
    font-family:'Inter',sans-serif;
    font-size:10.5px;
    font-weight:600;
    color:var(--gold);
    letter-spacing:0.22em;
    text-transform:uppercase;
    margin:0 0 8px;
  }
  h1{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:33px;
    line-height:1.2;
    margin:0;
    letter-spacing:0.01em;
  }
  .ornament{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-top:14px;
    color:var(--gold);
  }
  .ornament::before, .ornament::after{
    content:'';
    height:1px;
    width:38px;
    background:var(--line);
  }
  .ornament span{ font-size:13px; }

  .locate-row{
    display:flex;
    gap:10px;
    align-items:stretch;
    margin:22px 0 6px;
  }
  .mode-row{
    display:flex;
    gap:2px;
    margin:22px 0 0;
    background:var(--surface-alt);
    border-radius:20px;
    padding:3px;
  }
  .mode-btn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    background:transparent;
    color:var(--ink-soft);
    font-size:10px;
    font-weight:600;
    padding:5px 2px 6px;
    border-radius:16px;
    line-height:1.2;
    transition:background .15s ease, color .15s ease;
  }
  .mode-icon{ width:40px; height:40px; }
  .mode-btn.active{
    background:var(--accent);
    color:var(--accent-ink);
    box-shadow:var(--shadow);
  }
  button{ font-family:'Inter',sans-serif; cursor:pointer; border:none; }
  .btn-primary{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    background:var(--accent);
    color:var(--accent-ink);
    font-weight:600;
    font-size:15px;
    padding:14px 16px;
    border-radius:999px;
    box-shadow:var(--shadow);
    transition:transform .12s ease, opacity .12s ease;
  }
  .btn-icon{ width:40px; height:40px; flex-shrink:0; }
  .btn-primary:active{ transform:scale(0.98); }
  .btn-primary:disabled{ opacity:0.55; }
  .btn-primary:focus-visible, .btn-ghost:focus-visible, .icon-btn:focus-visible, input:focus-visible, .store-item:focus-visible{
    outline:2px solid var(--focus);
    outline-offset:2px;
  }

  .status-line{
    font-size:13px;
    color:var(--ink-soft);
    margin:10px 0 0;
    min-height:16px;
  }
  .status-line.error{ color:var(--danger); }
  .status-line.ok{ color:var(--near); }

  .divider{
    border:none;
    height:1px;
    background:var(--line);
    margin:30px 0 0;
  }

  .section-label{
    font-family:'Inter',sans-serif;
    font-size:10.5px;
    font-weight:600;
    color:var(--gold);
    letter-spacing:0.16em;
    text-transform:uppercase;
    margin:26px 0 14px;
  }

  .filter-row{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    margin-top:20px;
    padding:14px 16px;
    background:var(--surface-alt);
    border-radius:14px;
  }
  .filter-row label{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    color:var(--ink);
    cursor:pointer;
  }
  .filter-row input[type="checkbox"]{
    width:16px;
    height:16px;
    accent-color:var(--accent);
  }

  .corner-btn{
    position:absolute;
    top:2px;
    right:0;
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--surface-alt);
    color:var(--ink-soft);
    border-radius:999px;
    transition:background .15s ease, color .15s ease;
  }
  .corner-btn svg{ width:17px; height:17px; }
  .corner-btn.active{
    background:var(--accent);
    color:var(--accent-ink);
    box-shadow:var(--shadow);
  }
  .corner-popover{
    position:absolute;
    top:40px;
    right:0;
    background:var(--ink);
    color:var(--bg);
    font-size:12px;
    font-weight:600;
    padding:8px 14px;
    border-radius:999px;
    white-space:nowrap;
    box-shadow:var(--shadow);
    z-index:5;
  }
  .corner-popover::before{
    content:'';
    position:absolute;
    top:-4px;
    right:12px;
    width:8px;
    height:8px;
    background:var(--ink);
    transform:rotate(45deg);
  }

  ul.store-list{ list-style:none; margin:0; padding:0; }
  .pref-header{
    font-family:'Cormorant Garamond',serif;
    font-size:16px;
    font-weight:600;
    color:var(--accent);
    margin:22px 0 10px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .pref-header:first-child{ margin-top:4px; }
  .store-item{
    position:relative;
    display:flex;
    align-items:flex-start;
    gap:14px;
    padding:16px;
    margin-bottom:12px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
    cursor:pointer;
    transition:transform .12s ease;
  }
  .store-item:active{ transform:scale(0.99); }
  .store-item .hitbox{ display:flex; gap:14px; flex:1; min-width:0; }
  .distance-tag{
    position:absolute;
    top:10px;
    right:14px;
    font-size:10px;
    color:var(--ink-soft);
    background:var(--surface-alt);
    padding:2px 8px;
    border-radius:999px;
  }
  .metrics{
    font-family:'Cormorant Garamond',serif;
    min-width:78px;
    text-align:center;
    background:var(--surface-alt);
    border-radius:12px;
    padding:12px 8px 10px;
  }
  .eta{ font-size:25px; font-weight:600; line-height:1.05; color:var(--gold); }
  .eta-suffix{ font-family:'Inter',sans-serif; font-size:11px; color:var(--ink-soft); margin-left:2px; }
  .metric-duration{ font-family:'Inter',sans-serif; font-size:12px; font-weight:600; color:var(--ink); margin-top:6px; }
  .metric-fare{ font-family:'Inter',sans-serif; font-size:10.5px; color:var(--ink-soft); margin-top:3px; }
  .store-body{ flex:1; min-width:0; padding-top:2px; }
  .store-name{ font-weight:600; font-size:15px; margin:0 0 3px; word-break:break-word; }
  .store-note{ font-size:12.5px; color:var(--ink-soft); margin:0 0 8px; word-break:break-word; line-height:1.5; }
  .row-actions{ display:flex; gap:14px; align-items:center; }
  .btn-ghost{
    background:none; color:var(--accent); font-size:13px; font-weight:600;
    padding:0; text-decoration:none;
  }
  .btn-remove{ background:none; color:var(--ink-soft); font-size:13px; padding:0; }
  .btn-remove:hover{ color:var(--danger); }
  .chevron{ color:var(--ink-soft); font-size:18px; align-self:center; padding-left:2px; }

  .empty{
    padding:32px 20px;
    color:var(--ink-soft);
    font-size:14px;
    line-height:1.6;
    text-align:center;
    background:var(--surface-alt);
    border-radius:14px;
  }

  form.add-form{ margin-top:6px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:6px; letter-spacing:0.02em; }
  .field input, .field textarea{
    width:100%; background:var(--surface); border:1px solid var(--line);
    border-radius:10px; padding:11px 13px; font-size:15px; color:var(--ink);
    font-family:'Inter',sans-serif;
  }
  .field input:focus, .field textarea:focus{ outline:none; border-color:var(--accent); }
  .field textarea{ resize:vertical; min-height:70px; line-height:1.5; }
  .coord-row{ display:flex; gap:10px; }
  .coord-row .field{ flex:1; }

  .hint{ font-size:12.5px; color:var(--ink-soft); line-height:1.65; margin:0 0 16px; }

  .btn-secondary{
    width:100%; background:var(--surface); border:1px solid var(--line); color:var(--ink);
    font-weight:600; font-size:14.5px; padding:13px 16px; border-radius:999px;
  }

  footer{ margin-top:34px; font-size:11.5px; color:var(--ink-soft); text-align:center; letter-spacing:0.02em; }

  /* Detail sheet */
  .sheet-overlay{
    position:fixed; inset:0; background:var(--overlay);
    display:none; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  .sheet-overlay.open{ display:flex; }
  .sheet{
    background:var(--surface);
    width:100%;
    max-width:520px;
    border-radius:22px 22px 0 0;
    padding:14px 22px 30px;
    max-height:85vh;
    overflow-y:auto;
    box-shadow:0 -8px 30px rgba(0,0,0,0.15);
  }
  .sheet::before{
    content:'';
    display:block;
    width:36px;
    height:4px;
    border-radius:999px;
    background:var(--line);
    margin:6px auto 16px;
  }
  .sheet-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:14px; }
  .sheet-title{ font-family:'Cormorant Garamond',serif; font-size:21px; font-weight:600; margin:0; word-break:break-word; }
  .sheet-top-actions{ display:flex; align-items:center; gap:14px; flex-shrink:0; }
  .sheet-edit{ background:none; color:var(--accent); font-size:14px; font-weight:600; padding:2px 4px; }
  .sheet-close{ background:none; color:var(--ink-soft); font-size:22px; line-height:1; padding:2px 4px; }
  .sheet-dist{
    font-family:'Cormorant Garamond',serif;
    font-size:15px; color:var(--accent); font-weight:600; margin:0 0 16px;
  }
  .sheet-dist span.sub{ color:var(--ink-soft); font-weight:500; font-size:13px; margin-left:4px;}
  .detail-grid{ border-top:1px solid var(--line); }
  .detail-row{ display:flex; gap:16px; padding:13px 0; border-bottom:1px solid var(--line); }
  .detail-key{ min-width:76px; font-size:11.5px; color:var(--gold); font-weight:600; letter-spacing:0.04em; flex-shrink:0; padding-top:1px; }
  .detail-val{ font-size:14px; line-height:1.6; word-break:break-word; }
  .sheet-actions{ margin-top:20px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="corner-btn" id="viewToggleBtn" type="button" aria-label="登録店一覧を見る">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg>
    </button>
    <button class="corner-popover" id="cornerPopover" type="button" style="display:none;">お店一覧</button>
    <h1>Carte Sucrée</h1>
    <div class="ornament"></div>
  </header>

  <div class="mode-row" id="modeRow">
    <button class="mode-btn active" data-mode="r" type="button">
      <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="12" rx="3"/><line x1="6" y1="10" x2="18" y2="10"/><circle cx="9" cy="17" r="1"/><circle cx="15" cy="17" r="1"/><line x1="8" y1="15" x2="6.5" y2="19"/><line x1="16" y1="15" x2="17.5" y2="19"/></svg>
      <span>公共交通機関</span>
    </button>
    <button class="mode-btn" data-mode="d" type="button">
      <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l1.4-4.8A2 2 0 0 1 7.3 9.8h9.4a2 2 0 0 1 1.9 1.4L20 16"/><rect x="3" y="16" width="18" height="3" rx="1.2"/><circle cx="7.5" cy="19.3" r="1.2"/><circle cx="16.5" cy="19.3" r="1.2"/></svg>
      <span>車</span>
    </button>
    <button class="mode-btn" data-mode="b" type="button">
      <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17l4-9h3l3 9"/><path d="M10.5 8h3"/><path d="M9 17h9"/></svg>
      <span>自転車</span>
    </button>
    <button class="mode-btn" data-mode="w" type="button">
      <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.2" cy="4.2" r="1.6" fill="currentColor" stroke="none"/><path d="M13 7l-1.6 3.6 3 2.1-.6 6.3"/><path d="M11.4 10.6l-3.4 1.6"/><path d="M14.4 12.7l2.8 1 .9 3.8"/><path d="M11.9 16.6l-2.3 3.4"/></svg>
      <span>徒歩</span>
    </button>
  </div>

  <div class="locate-row">
    <button class="btn-primary" id="locateBtn">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 9l1-4.5h13l1 4.5"/><path d="M4.5 9a1.8 1.8 0 0 0 3.6 0 1.8 1.8 0 0 0 3.6 0 1.8 1.8 0 0 0 3.6 0 1.8 1.8 0 0 0 3.6 0"/><path d="M5.5 9v9.5h13V9"/><rect x="10.2" y="13.5" width="3.6" height="5"/></svg>
      <span>近くのお店</span>
    </button>
  </div>
  <p class="status-line" id="statusLine"></p>
  <button class="btn-ghost" id="manualToggle" style="margin:8px 0 0;">うまく取得できない場合:現在地を手入力する</button>
  <div id="manualPos" style="display:none; margin-top:10px;">
    <p class="hint" style="margin-bottom:10px;">地図アプリで自分の現在地(青い点)を長押しすると座標が表示されます。それをそのままコピーして貼り付けてください。</p>
    <div class="field">
      <label for="manualCoords">座標</label>
      <input type="text" id="manualCoords" placeholder="北35.25609°, 東136.88157° または 35.25609, 136.88157">
    </div>
    <button class="btn-secondary" id="manualApply">この位置を使う</button>
  </div>

  <div class="filter-row" id="filterRow">
    <label><input type="checkbox" id="filterAll" checked> すべて表示</label>
    <label><input type="checkbox" id="filterFriend" checked> 友人</label>
    <label><input type="checkbox" id="filterFujinoshin" checked> フジノシン</label>
  </div>

  <p class="section-label" id="listLabel">登録済みのお店</p>
  <ul class="store-list" id="storeList"></ul>
  <div class="empty" id="emptyState" style="display:none;">
    <span id="emptyStateText">まだお店が登録されていません。下のフォームから追加してください。</span>
  </div>

  <hr class="divider">

  <p class="section-label">お店を追加</p>
  <p class="hint">
    地図アプリでお店の場所を長押しし、表示された座標をそのままコピーして貼り付けられます。移動時間は直線距離からの目安です(公共交通機関は乗換・待ち時間を含まないため特に目安程度です)。
  </p>
  <form class="add-form" id="addForm">
    <div class="field">
      <label for="name">店名</label>
      <input type="text" id="name" placeholder="例：〇〇珈琲店" required>
    </div>
    <div class="field">
      <label for="note">住所・メモ（任意）</label>
      <input type="text" id="note" placeholder="例：渋谷区〇〇 1-2-3">
    </div>
    <div class="field">
      <label for="station">最寄駅（任意）</label>
      <input type="text" id="station" placeholder="例：渋谷駅">
    </div>
    <div class="field">
      <label for="coords">座標(地図アプリからコピー)</label>
      <input type="text" id="coords" placeholder="北35.25609°, 東136.88157° または 35.25609, 136.88157" required>
    </div>
    <div class="coord-row">
      <div class="field">
        <label for="hours">営業時間（任意）</label>
        <input type="text" id="hours" placeholder="例：10:00-19:00">
      </div>
      <div class="field">
        <label for="closedDay">定休日（任意）</label>
        <input type="text" id="closedDay" placeholder="例：月曜">
      </div>
    </div>
    <div class="field">
      <label for="extra">備考（任意・席数など）</label>
      <input type="text" id="extra" placeholder="例：カウンター6席、予約可">
    </div>
    <div class="field">
      <label for="cakeNotes">食べたケーキ（任意）</label>
      <textarea id="cakeNotes" placeholder="例：2024/10 モンブラン"></textarea>
    </div>
    <div class="coord-row">
      <div class="field">
        <label for="website">公式サイト（任意）</label>
        <input type="text" id="website" placeholder="https://...">
      </div>
      <div class="field">
        <label for="instagram">Instagram（任意）</label>
        <input type="text" id="instagram" placeholder="https://instagram.com/...">
      </div>
    </div>
    <button type="submit" class="btn-secondary">お店を登録する</button>
  </form>

  <footer>座標と情報はこの端末のブラウザ内にのみ保存されます。</footer>
</div>

<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<script>
(function(){
  var STORAGE_KEY = 'store_distance_tracker_v1';
  var storeListEl = document.getElementById('storeList');
  var emptyStateEl = document.getElementById('emptyState');
  var listLabelEl = document.getElementById('listLabel');
  var statusLineEl = document.getElementById('statusLine');
  var locateBtn = document.getElementById('locateBtn');
  var addForm = document.getElementById('addForm');
  var filterAll = document.getElementById('filterAll');
  var filterFriend = document.getElementById('filterFriend');
  var filterFujinoshin = document.getElementById('filterFujinoshin');
  var sheetOverlay = document.getElementById('sheetOverlay');
  var sheetEl = document.getElementById('sheet');

  var stores = [];

  function mergeSeedStores(){
    var existingIds = {};
    stores.forEach(function(s){ existingIds[s.id] = true; });
    var added = false;
    SEED_STORES.forEach(function(seed){
      if(!existingIds[seed.id]){
        stores.push(seed);
        added = true;
      }
    });
    if(added) saveStores();
  }

  function extractPrefecture(store){
    var text = (store.note || '') + ' ' + (store.station || '');
    for(var i = 0; i < PREF_ORDER.length; i++){
      if(text.indexOf(PREF_ORDER[i]) !== -1) return PREF_ORDER[i];
    }
    return null;
  } // 'nearby' sorted by distance, 'all' full registered list

  function loadStores(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      stores = raw ? JSON.parse(raw) : [];
    }catch(e){ stores = []; }
  }

  function saveStores(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(stores));
    }catch(e){
      setStatus('保存に失敗しました。ブラウザの設定をご確認ください。', 'error');
    }
  }

  function setStatus(msg, type){
    statusLineEl.textContent = msg || '';
    statusLineEl.className = 'status-line' + (type ? ' ' + type : '');
  }

  // Parses coordinate text copied from a map app, e.g. "北35.25609°, 東136.88157°",
  // "N35.25609° E136.88157°", or plain "35.25609, 136.88157". Returns {lat,lng} or null.
  function parseCoords(text){
    if(!text) return null;
    text = text.trim();

    var latDir = text.match(/[北南NSns]\s*([0-9]+(?:\.[0-9]+)?)/);
    var lngDir = text.match(/[東西EWew]\s*([0-9]+(?:\.[0-9]+)?)/);
    if(latDir && lngDir){
      var latVal = parseFloat(latDir[1]);
      var lngVal = parseFloat(lngDir[1]);
      if(/[南Ss]/.test(latDir[0])) latVal = -latVal;
      if(/[西Ww]/.test(lngDir[0])) lngVal = -lngVal;
      if(!isNaN(latVal) && !isNaN(lngVal)) return { lat: latVal, lng: lngVal };
    }

    var nums = text.match(/-?[0-9]+(?:\.[0-9]+)?/g);
    if(nums && nums.length >= 2){
      var a = parseFloat(nums[0]);
      var b = parseFloat(nums[1]);
      if(!isNaN(a) && !isNaN(b)) return { lat: a, lng: b };
    }
    return null;
  }

  function haversineKm(lat1, lon1, lat2, lon2){
    var R = 6371;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
  }

  function formatDistance(km){
    if(km < 1) return { num: Math.round(km * 1000).toString(), unit: 'm' };
    return { num: km.toFixed(1), unit: 'km' };
  }

  function formatMinutes(km, kmh){
    var min = (km / kmh) * 60;
    if(min < 1) return '1分未満';
    return Math.round(min) + '分';
  }

  function modeInfo(mode){
    if(mode === 'd') return { kmh: DRIVE_KMH, label: '車' };
    if(mode === 'b') return { kmh: BIKE_KMH, label: '自転車' };
    if(mode === 'r') return { kmh: TRANSIT_KMH, label: '公共交通機関' };
    return { kmh: WALK_KMH, label: '徒歩' };
  }

  function formatEta(km, kmh){
    var minutes = (km / kmh) * 60;
    var eta = new Date(Date.now() + minutes * 60000);
    var hh = String(eta.getHours()).padStart(2, '0');
    var mm = String(eta.getMinutes()).padStart(2, '0');
    return hh + ':' + mm;
  }

  // Very rough fare estimate. Transit uses a simplified Japanese local-fare
  // tier table; driving uses a rough fuel-cost-per-km figure. Both are meant
  // as ballpark numbers only, not real fares.
  function fareEstimate(km, mode){
    if(mode === 'w' || mode === 'b') return '無料';
    if(mode === 'd'){
      var fuel = Math.round((km * 15) / 10) * 10;
      return '¥' + fuel.toLocaleString() + '(燃料目安)';
    }
    // mode === 'r'
    var tiers = [
      [3, 150], [6, 170], [10, 200], [15, 240], [20, 300],
      [30, 380], [40, 480], [60, 610]
    ];
    for(var i = 0; i < tiers.length; i++){
      if(km <= tiers[i][0]) return '¥' + tiers[i][1].toLocaleString() + '目安';
    }
    var extra = Math.round(610 + (km - 60) * 8);
    return '¥' + extra.toLocaleString() + '目安';
  }

  function mapsUrl(store, mode){
    // mode: 'w' walking, 'd' driving, 'r' public transit, 'b' bicycle. Opens in the iPhone's built-in Maps app.
    var dest = store.lat + ',' + store.lng;
    var flg = (mode === 'd' || mode === 'r' || mode === 'b') ? mode : 'w';
    if(currentPos){
      var origin = currentPos.lat + ',' + currentPos.lng;
      return 'https://maps.apple.com/?saddr=' + encodeURIComponent(origin) +
             '&daddr=' + encodeURIComponent(dest) + '&dirflg=' + flg;
    }
    return 'https://maps.apple.com/?q=' + encodeURIComponent(store.name) + '&ll=' + encodeURIComponent(dest);
  }

  function closeSheet(){
    sheetOverlay.classList.remove('open');
    sheetEl.innerHTML = '';
  }

  function openSheet(store, dist){
    var rows = [];
    var mi = modeInfo(travelMode);
    if(dist !== null){
      var f = formatDistance(dist);
      rows.push(['距離', f.num + ' ' + f.unit + '（直線距離）']);
      var timeLabel = mi.label + 'で約' + formatMinutes(dist, mi.kmh);
      if(travelMode === 'r') timeLabel += '(乗換・待ち時間を含まない目安)';
      rows.push(['移動時間', timeLabel]);
    }
    if(store.note) rows.push(['住所・メモ', store.note]);
    if(store.station) rows.push(['最寄駅', store.station]);
    if(store.recommender){
      var recLabel = store.recommender === 'friend' ? '友人' : (store.recommender === 'fujinoshin' ? 'フジノシン' : store.recommender);
      rows.push(['オススメ', recLabel]);
    }
    if(store.extra) rows.push(['備考', store.extra]);
    if(store.cakeNotes) rows.push(['食べたケーキ', store.cakeNotes]);

    var rowsHtml = rows.map(function(r){
      return '<div class="detail-row"><div class="detail-key">' + escapeHtml(r[0]) +
             '</div><div class="detail-val">' + escapeHtml(r[1]).replace(/\n/g, '<br>') + '</div></div>';
    }).join('');

    var linkButtons = '';
    if(store.website){
      linkButtons += '<a class="btn-ghost" id="sheetWebsite" target="_blank" rel="noopener">公式サイト</a><span style="display:inline-block;width:18px;"></span>';
    }
    if(store.instagram){
      linkButtons += '<a class="btn-ghost" id="sheetInstagram" target="_blank" rel="noopener">Instagram</a><span style="display:inline-block;width:18px;"></span>';
    }

    sheetEl.innerHTML =
      '<div class="sheet-top">' +
        '<h2 class="sheet-title"></h2>' +
        '<div class="sheet-top-actions">' +
          '<button class="sheet-edit" type="button">編集</button>' +
          '<button class="sheet-close" aria-label="閉じる">×</button>' +
        '</div>' +
      '</div>' +
      '<div class="detail-grid">' + rowsHtml + '</div>' +
      '<div class="sheet-actions">' +
        linkButtons +
        '<a class="btn-ghost" id="sheetRoute" target="_blank" rel="noopener">マップで' + mi.label + 'ルートを開く</a>' +
      '</div>';

    sheetEl.querySelector('.sheet-title').textContent = store.name;
    sheetEl.querySelector('.sheet-close').addEventListener('click', closeSheet);
    sheetEl.querySelector('.sheet-edit').addEventListener('click', function(){ openEditSheet(store); });
    sheetEl.querySelector('#sheetRoute').href = mapsUrl(store, travelMode);
    if(store.website){ sheetEl.querySelector('#sheetWebsite').href = store.website; }
    if(store.instagram){ sheetEl.querySelector('#sheetInstagram').href = store.instagram; }

    sheetOverlay.classList.add('open');
  }

  function openEditSheet(store){
    function esc(v){ return escapeHtml(v || ''); }
    var coordsStr = store.lat + ', ' + store.lng;

    sheetEl.innerHTML =
      '<div class="sheet-top">' +
        '<h2 class="sheet-title">編集</h2>' +
        '<button class="sheet-close" aria-label="閉じる">×</button>' +
      '</div>' +
      '<div class="field"><label>店名</label><input type="text" id="editName" value="' + esc(store.name) + '"></div>' +
      '<div class="field"><label>住所・メモ</label><input type="text" id="editNote" value="' + esc(store.note) + '"></div>' +
      '<div class="field"><label>最寄駅</label><input type="text" id="editStation" value="' + esc(store.station) + '"></div>' +
      '<div class="field"><label>座標</label><input type="text" id="editCoords" value="' + esc(coordsStr) + '"></div>' +
      '<div class="coord-row">' +
        '<div class="field"><label>営業時間</label><input type="text" id="editHours" value="' + esc(store.hours) + '"></div>' +
        '<div class="field"><label>定休日</label><input type="text" id="editClosedDay" value="' + esc(store.closedDay) + '"></div>' +
      '</div>' +
      '<div class="field"><label>備考</label><input type="text" id="editExtra" value="' + esc(store.extra) + '"></div>' +
      '<div class="field"><label>食べたケーキ(過去に食べたもののメモ)</label><textarea id="editCakeNotes" placeholder="例:&#10;2024/10 モンブラン&#10;2025/3 いちごタルト">' + esc(store.cakeNotes) + '</textarea></div>' +
      '<div class="coord-row">' +
        '<div class="field"><label>公式サイト</label><input type="text" id="editWebsite" value="' + esc(store.website) + '"></div>' +
        '<div class="field"><label>Instagram</label><input type="text" id="editInstagram" value="' + esc(store.instagram) + '"></div>' +
      '</div>' +
      '<div class="sheet-actions">' +
        '<button class="btn-secondary" id="editSave" type="button">保存する</button>' +
        '<button class="btn-remove" id="editDelete" type="button" style="margin-top:12px;">この店を削除</button>' +
        '<p class="status-line" id="editStatus"></p>' +
      '</div>';

    sheetEl.querySelector('.sheet-close').addEventListener('click', closeSheet);

    sheetEl.querySelector('#editSave').addEventListener('click', function(){
      var name = document.getElementById('editName').value.trim();
      var parsed = parseCoords(document.getElementById('editCoords').value);
      var statusEl = document.getElementById('editStatus');
      if(!name || !parsed){
        statusEl.textContent = '店名と座標を確認してください。';
        statusEl.className = 'status-line error';
        return;
      }
      store.name = name;
      store.note = document.getElementById('editNote').value.trim();
      store.station = document.getElementById('editStation').value.trim();
      store.lat = parsed.lat;
      store.lng = parsed.lng;
      store.hours = document.getElementById('editHours').value.trim();
      store.closedDay = document.getElementById('editClosedDay').value.trim();
      store.extra = document.getElementById('editExtra').value.trim();
      store.cakeNotes = document.getElementById('editCakeNotes').value.trim();
      store.website = document.getElementById('editWebsite').value.trim();
      store.instagram = document.getElementById('editInstagram').value.trim();

      var idx = stores.findIndex(function(s){ return s.id === store.id; });
      if(idx !== -1) stores[idx] = store;
      saveStores();
      closeSheet();
      render();
    });

    sheetEl.querySelector('#editDelete').addEventListener('click', function(){
      stores = stores.filter(function(s){ return s.id !== store.id; });
      saveStores();
      closeSheet();
      render();
    });

    sheetOverlay.classList.add('open');
  }

  sheetOverlay.addEventListener('click', function(e){
    if(e.target === sheetOverlay) closeSheet();
  });

  function escapeHtml(s){
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function render(){
    storeListEl.innerHTML = '';

    var visibleStores = stores.filter(function(s){
      if(s.recommender === 'friend') return filterFriend.checked;
      if(s.recommender === 'fujinoshin') return filterFujinoshin.checked;
      return true;
    });

    if(visibleStores.length === 0){
      emptyStateEl.style.display = 'block';
      document.getElementById('emptyStateText').textContent = stores.length === 0
        ? 'まだお店が登録されていません。下のフォームから追加してください。'
        : '表示する店がありません。チェックボックスをご確認ください。';
      listLabelEl.textContent = stores.length === 0 ? '登録済みのお店' : '表示する店がありません(チェックボックスをご確認ください)';
      return;
    }
    emptyStateEl.style.display = 'none';

    var showMetrics = (viewTab === 'nearby' && !!currentPos);

    var withDist = visibleStores.map(function(s){
      var d = currentPos ? haversineKm(currentPos.lat, currentPos.lng, s.lat, s.lng) : null;
      return { store: s, dist: d };
    });

    if(viewTab === 'all'){
      listLabelEl.textContent = '登録店一覧（' + visibleStores.length + '件）';
    }else if(currentPos){
      withDist.sort(function(a, b){ return a.dist - b.dist; });
      listLabelEl.textContent = '近い順（' + visibleStores.length + '件）';
    }else{
      listLabelEl.textContent = '登録済みのお店（' + visibleStores.length + '件・現在地未取得）';
    }

    function buildStoreLi(item){
      var s = item.store;
      var li = document.createElement('li');
      li.className = 'store-item';
      li.tabIndex = 0;

      if(showMetrics && item.dist !== null){
        var fDist = formatDistance(item.dist);
        var tag = document.createElement('span');
        tag.className = 'distance-tag';
        tag.textContent = fDist.num + fDist.unit;
        li.appendChild(tag);
      }

      var hitbox = document.createElement('div');
      hitbox.className = 'hitbox';

      if(showMetrics && item.dist !== null){
        var mi = modeInfo(travelMode);
        var metrics = document.createElement('div');
        metrics.className = 'metrics';
        metrics.innerHTML =
          '<div class="eta">' + formatEta(item.dist, mi.kmh) + '<span class="eta-suffix">着</span></div>' +
          '<div class="metric-duration">' + mi.label + ' ' + formatMinutes(item.dist, mi.kmh) + '</div>' +
          '<div class="metric-fare">' + fareEstimate(item.dist, travelMode) + '</div>';
        hitbox.appendChild(metrics);
      }

      var body = document.createElement('div');
      body.className = 'store-body';

      var nameEl = document.createElement('p');
      nameEl.className = 'store-name';
      nameEl.textContent = s.name;
      body.appendChild(nameEl);

      if(s.station){
        var stationEl = document.createElement('p');
        stationEl.className = 'store-note';
        stationEl.textContent = '最寄駅: ' + s.station;
        body.appendChild(stationEl);
      }

      if(s.note){
        var noteEl = document.createElement('p');
        noteEl.className = 'store-note';
        noteEl.textContent = s.note;
        body.appendChild(noteEl);
      }

      if(s.hours || s.closedDay){
        var hoursEl = document.createElement('p');
        hoursEl.className = 'store-note';
        var hoursParts = [];
        if(s.hours) hoursParts.push(s.hours);
        if(s.closedDay) hoursParts.push('定休日: ' + s.closedDay);
        hoursEl.textContent = hoursParts.join(' ／ ');
        body.appendChild(hoursEl);
      }

      var actions = document.createElement('div');
      actions.className = 'row-actions';

      var link = document.createElement('a');
      link.className = 'btn-ghost';
      link.href = mapsUrl(s, travelMode);
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = 'マップでルートを開く';
      link.addEventListener('click', function(e){ e.stopPropagation(); });
      actions.appendChild(link);

      var removeBtn = document.createElement('button');
      removeBtn.className = 'btn-remove';
      removeBtn.textContent = '削除';
      removeBtn.addEventListener('click', function(e){
        e.stopPropagation();
        stores = stores.filter(function(x){ return x.id !== s.id; });
        saveStores();
        render();
      });
      actions.appendChild(removeBtn);

      body.appendChild(actions);

      hitbox.appendChild(body);

      var chevron = document.createElement('span');
      chevron.className = 'chevron';
      chevron.textContent = '›';

      li.appendChild(hitbox);
      li.appendChild(chevron);

      li.addEventListener('click', function(){ openSheet(s, item.dist); });
      li.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openSheet(s, item.dist); }
      });

      return li;
    }

    if(viewTab === 'all'){
      PREF_ORDER.forEach(function(pref){
        var group = withDist.filter(function(item){ return extractPrefecture(item.store) === pref; });
        if(group.length === 0) return;
        group.sort(function(a, b){ return a.store.name.localeCompare(b.store.name, 'ja'); });
        var headerLi = document.createElement('li');
        headerLi.className = 'pref-header';
        headerLi.textContent = pref;
        storeListEl.appendChild(headerLi);
        group.forEach(function(item){ storeListEl.appendChild(buildStoreLi(item)); });
      });
      var others = withDist.filter(function(item){ return !extractPrefecture(item.store); });
      if(others.length){
        others.sort(function(a, b){ return a.store.name.localeCompare(b.store.name, 'ja'); });
        var headerLiOther = document.createElement('li');
        headerLiOther.className = 'pref-header';
        headerLiOther.textContent = 'その他';
        storeListEl.appendChild(headerLiOther);
        others.forEach(function(item){ storeListEl.appendChild(buildStoreLi(item)); });
      }
    }else{
      withDist.forEach(function(item){ storeListEl.appendChild(buildStoreLi(item)); });
    }
  }

  function attemptLocate(silent){
    if(!('geolocation' in navigator)){
      if(!silent) setStatus('この端末では現在地を取得できません。', 'error');
      return;
    }
    locateBtn.disabled = true;
    if(!silent) setStatus('現在地を取得しています…');
    navigator.geolocation.getCurrentPosition(
      function(pos){
        currentPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        locateBtn.disabled = false;
        setStatus('現在地を取得しました。距離の近い順に並べ替えました。', 'ok');
        render();
      },
      function(err){
        locateBtn.disabled = false;
        if(silent){
          setStatus('');
          return;
        }
        var msg = '現在地を取得できませんでした。';
        if(err && err.code === 1) msg = '位置情報の利用が許可されていません。ブラウザの設定をご確認ください。';
        setStatus(msg, 'error');
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
    );
  }

  locateBtn.addEventListener('click', function(){ attemptLocate(false); });

  var manualToggle = document.getElementById('manualToggle');
  var manualPos = document.getElementById('manualPos');
  var manualApply = document.getElementById('manualApply');

  manualToggle.addEventListener('click', function(){
    var isOpen = manualPos.style.display !== 'none';
    manualPos.style.display = isOpen ? 'none' : 'block';
  });

  manualApply.addEventListener('click', function(){
    var parsed = parseCoords(document.getElementById('manualCoords').value);
    if(!parsed || isNaN(parsed.lat) || isNaN(parsed.lng) || parsed.lat < -90 || parsed.lat > 90 || parsed.lng < -180 || parsed.lng > 180){
      setStatus('座標を読み取れませんでした。コピーした座標をそのまま貼り付けてください。', 'error');
      return;
    }
    currentPos = { lat: parsed.lat, lng: parsed.lng };
    setStatus('入力した位置を使って、距離の近い順に並べ替えました。', 'ok');
    render();
  });

  addForm.addEventListener('submit', function(e){
    e.preventDefault();
    var name = document.getElementById('name').value.trim();
    var note = document.getElementById('note').value.trim();
    var parsedCoords = parseCoords(document.getElementById('coords').value);
    var lat = parsedCoords ? parsedCoords.lat : NaN;
    var lng = parsedCoords ? parsedCoords.lng : NaN;
    var hours = document.getElementById('hours').value.trim();
    var closedDay = document.getElementById('closedDay').value.trim();
    var extra = document.getElementById('extra').value.trim();
    var station = document.getElementById('station').value.trim();
    var website = document.getElementById('website').value.trim();
    var instagram = document.getElementById('instagram').value.trim();
    var cakeNotes = document.getElementById('cakeNotes').value.trim();

    if(!name || isNaN(lat) || isNaN(lng)){
      setStatus('店名と座標を入力してください。座標が読み取れませんでした。', 'error');
      return;
    }
    if(lat < -90 || lat > 90 || lng < -180 || lng > 180){
      setStatus('座標の値が範囲外です。コピーした座標をそのまま貼り付けてください。', 'error');
      return;
    }

    stores.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2),
      name: name,
      note: note,
      lat: lat,
      lng: lng,
      hours: hours,
      closedDay: closedDay,
      extra: extra,
      station: station,
      website: website,
      instagram: instagram,
      cakeNotes: cakeNotes
    });
    saveStores();
    addForm.reset();
    setStatus('「' + name + '」を登録しました。', 'ok');
    render();
  });

  var modeButtons = document.querySelectorAll('.mode-btn');
  modeButtons.forEach(function(btn){
    btn.addEventListener('click', function(){
      travelMode = btn.getAttribute('data-mode');
      modeButtons.forEach(function(b){ b.classList.toggle('active', b === btn); });
      render();
    });
  });

  var viewToggleBtn = document.getElementById('viewToggleBtn');
  var cornerPopover = document.getElementById('cornerPopover');

  function applyViewTheme(){
    document.body.classList.toggle('all-view', viewTab === 'all');
    viewToggleBtn.classList.toggle('active', viewTab === 'all');
    viewToggleBtn.setAttribute('aria-label', viewTab === 'all' ? '近い順で見る' : '登録店一覧を見る');

    var hideForAll = viewTab === 'all';
    document.getElementById('modeRow').style.display = hideForAll ? 'none' : 'flex';
    document.querySelector('.locate-row').style.display = hideForAll ? 'none' : 'flex';
    document.getElementById('manualToggle').style.display = hideForAll ? 'none' : 'block';
    if(hideForAll) document.getElementById('manualPos').style.display = 'none';
  }

  viewToggleBtn.addEventListener('click', function(e){
    e.stopPropagation();
    var willOpen = cornerPopover.style.display === 'none';
    cornerPopover.style.display = willOpen ? 'block' : 'none';
    cornerPopover.textContent = viewTab === 'all' ? '近い順' : 'お店一覧';
  });

  cornerPopover.addEventListener('click', function(e){
    e.stopPropagation();
    viewTab = (viewTab === 'all') ? 'nearby' : 'all';
    applyViewTheme();
    cornerPopover.style.display = 'none';
    render();
  });

  document.addEventListener('click', function(e){
    if(cornerPopover.style.display !== 'none' && e.target !== viewToggleBtn && !viewToggleBtn.contains(e.target)){
      cornerPopover.style.display = 'none';
    }
  });

  filterAll.addEventListener('change', function(){
    if(filterAll.checked){
      filterFriend.checked = true;
      filterFujinoshin.checked = true;
    }
    render();
  });
  [filterFriend, filterFujinoshin].forEach(function(cb){
    cb.addEventListener('change', function(){
      filterAll.checked = filterFriend.checked && filterFujinoshin.checked;
      render();
    });
  });

  function tryLocationFromUrl(){
    try{
      var params = new URLSearchParams(window.location.search);
      var lat = parseFloat(params.get('lat'));
      var lng = parseFloat(params.get('lng'));
      if(!isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180){
        currentPos = { lat: lat, lng: lng };
        setStatus('URLから現在地を読み込みました。距離の近い順に並べ替えました。', 'ok');
        render();
        return true;
      }
    }catch(e){}
    return false;
  }

  loadStores();
  mergeSeedStores();
  render();
  if(!tryLocationFromUrl()){
    attemptLocate(true);
  }
})();
</script>
</body>
</html>
